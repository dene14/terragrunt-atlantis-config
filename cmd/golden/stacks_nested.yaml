automerge: false
parallel_apply: true
parallel_plan: true
projects:
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - '**/*.hcl'
    - '**/*.tf*'
    - ../db/**/*.hcl
    - ../db/**/*.tf*
  dir: catalog/mini-stack
  name: catalog_mini-stack
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - '**/*.hcl'
    - '**/*.tf*'
    - ../../catalog/vpc/**/*.hcl
    - ../../catalog/vpc/**/*.tf*
    - ../../catalog/mini-stack/**/*.hcl
    - ../../catalog/mini-stack/**/*.tf*
  dir: live/prod
  name: live_prod
version: 3
