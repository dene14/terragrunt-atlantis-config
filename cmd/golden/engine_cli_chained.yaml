automerge: false
parallel_apply: true
parallel_plan: true
projects:
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
  dir: dependency
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - ../dependency/**/*.hcl
    - ../dependency/**/*.tf*
  dir: depender
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - ../dependency/**/*.hcl
    - ../dependency/**/*.tf*
    - ../depender/**/*.hcl
    - ../depender/**/*.tf*
    - nested/**/*.hcl
    - nested/**/*.tf*
  dir: depender_on_depender
- autoplan:
    enabled: false
    when_modified:
    - '*.hcl'
    - '*.tf*'
    - ../../dependency/**/*.hcl
    - ../../dependency/**/*.tf*
  dir: depender_on_depender/nested
version: 3
