name: release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    name: Create Release
    runs-on: "ubuntu-latest"

    steps:
      # Install golang
      - uses: actions/setup-go@v7
        with:
          go-version: "^1.27"

      # Checkout code
      - uses: actions/checkout@v7

      # Install golang deps, using a cache
      - uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ubuntu-latest-1.27-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ubuntu-latest-1.27-go-

      # Get the version from the tag
      - name: Get the version
        id: get_version
        run: echo VERSION=${GITHUB_REF#refs/tags/v} >> $GITHUB_OUTPUT

      # build binaries for all supported environments
      - run: sudo apt update && sudo apt install -y make
      - name: Build binaries
        run: make build-all
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}

      # Create the binary checksums
      - name: Create checksums
        run: |
          readonly BUILD_DIR="build/${{ steps.get_version.outputs.VERSION }}"
          # GNU coreutils checksum format: "<hash><two spaces><relative name>"
          # (single-space or prefixed paths break `sha256sum -c` for users;
          # see transcend-io/terragrunt-atlantis-config#309)
          find "$BUILD_DIR" -type f -exec sha256sum {} + | awk -v build_dir="$BUILD_DIR" '{sub("^"build_dir"/", ""); printf "%s  %s\n", $1, $2}' > SHA256SUMS
          find "$BUILD_DIR" -type f -exec sha512sum {} + | awk -v build_dir="$BUILD_DIR" '{sub("^"build_dir"/", ""); printf "%s  %s\n", $1, $2}' > SHA512SUMS

      # Create the release. softprops/action-gh-release replaces the archived
      # marvinpinto/action-automatic-releases (node16 → forced node20/24) and
      # publishes the built binaries + checksums onto the tag-triggered release.
      - uses: softprops/action-gh-release@v3
        with:
          # Mark tags with -alpha/-beta/-rc suffixes as pre-release
          # (so alphas don't override "Latest" for stable releases)
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
          files: |
            build/${{ steps.get_version.outputs.VERSION }}/*
            SHA256SUMS
            SHA512SUMS
